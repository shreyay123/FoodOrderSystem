<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome | Food Order</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff5f5, #ffecec);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* prevents scroll */
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 32px;
            margin: 5px 0;
        }

        .header p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .food-gallery {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }

        .food-card {
            width: 150px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .food-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cta-section {
            margin-top: 20px;
        }

        .order-btn {
            padding: 12px 36px;
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.25);
            transition: 0.3s;
        }

        .order-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🍽 Order Your Food </h1>
    <p>Fresh & tasty food in minutes</p>
</div>

<div class="food-gallery">
    <div class="food-card">
        <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" alt="Pizza">
    </div>
    <div class="food-card">
        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1" alt="Burger">
    </div>
    <div class="food-card">
        <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe" alt="Biryani">
    </div>
</div>

<div class="cta-section">
    <a href="ordernow" class="order-btn">Order Food</a>
</div>

</body>
</html>
