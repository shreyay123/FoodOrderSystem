<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Food</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                url("https://images.unsplash.com/photo-1504674900247-0877df9cc836") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* no scroll */
        }

        .order-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            width: 320px; /* smaller width */
            padding: 18px; /* reduced padding */
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
        }

        .order-card h2 {
            text-align: center;
            margin-bottom: 14px;
            font-size: 18px; /* smaller heading */
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            font-size: 12px;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 6px; /* smaller input height */
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 12px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 3px rgba(255,107,107,0.5);
        }

        .btn {
            width: 100%;
            padding: 8px; /* smaller button */
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1e90ff, #3742fa);
            color: #fff;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<div class="order-card">
    <h2>🍽 Order Food </h2>

    <form th:action="@{/orders}" th:object="${dish}" method="post">

        <label>Dish Type</label>
        <select th:field="*{dishType}">
            <option value="">-- Select Type --</option>
            <option value="Veg">Veg</option>
            <option value="Non-Veg">Non-Veg</option>
            <option value="Jain">Jain</option>
        </select>

        <label>Dish Name</label>
        <input type="text" th:field="*{dishName}" placeholder="Dish name">

        <label>Quantity</label>
        <input type="number" th:field="*{quantity}" placeholder="Quantity">

        <label>Order Time</label>
        <input type="time" th:field="*{orderTime}">

        <label>Hotel Name</label>
        <input type="text" th:field="*{hotelName}" placeholder="Restaurant name">

        <label>Location</label>
        <input type="text" th:field="*{location}" placeholder="Delivery location">

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary">Order Now</button>
        <button type="button" class="btn btn-secondary" 
                th:onclick="|window.location.href='@{/my-orders}'|">
            📦 My Orders
        </button>

    </form>
</div>

</body>
</html>
