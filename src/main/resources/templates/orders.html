<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Orders</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            padding: 40px;
            margin: 0;
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        th {
            background: #6c5ce7;
            color: #ffffff;
            padding: 14px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
            color: #2d3436;
        }

        tr:hover {
            background-color: #f5f6fa;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            margin: 0 4px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .edit {
            background-color: #0984e3;
        }

        .edit:hover {
            background-color: #0652dd;
        }

        .delete {
            background-color: #d63031;
        }

        .delete:hover {
            background-color: #c0392b;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                display: none;
            }

            tr {
                margin-bottom: 15px;
                background: #ffffff;
                border-radius: 10px;
                padding: 10px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            }

            td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }

            td::before {
                content: attr(data-label);
                position: absolute;
                left: 15px;
                font-weight: bold;
                color: #636e72;
            }
        }
    </style>
</head>

<body>

<h2>📋 Your Order List</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Dish Type</th>
            <th>Dish Name</th>
            <th>Order Time</th>
            <th>Hotel Name</th>
            <th>Location</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="dish : ${orders}">
            <td data-label="ID" th:text="${dish.id}"></td>
            <td data-label="Dish Type" th:text="${dish.dishType}"></td>
            <td data-label="Dish Name" th:text="${dish.dishName}"></td>
            <td data-label="Order Time" th:text="${dish.orderTime}"></td>
            <td data-label="Hotel Name" th:text="${dish.hotelName}"></td>
            <td data-label="Location" th:text="${dish.location}"></td>
            <td data-label="Quantity" th:text="${dish.quantity}"></td>
            <td data-label="Action">
                <a th:href="@{/edit/{id}(id=${dish.id})}" class="btn edit">Edit</a>
                <a th:href="@{/delete/{id}(id=${dish.id})}" class="btn delete">Delete</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
